<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turbulence FMC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="fmc-body">

  <div class="fmc-screen-container">

    <!-- Left buttons -->
    <div class="softkeys-left">
      <button type="button" class="softkey" id="resetBtn">RESET</button>
      <button type="button" class="softkey" id="helpBtn">HELP</button>
      <button type="button" class="softkey" id="upBtn">▲</button>
      <button type="button" class="softkey" id="downBtn">▼</button>
    </div>

    <form id="fmcForm" action="/predict" method="post">

      <div class="fmc-screen">

        <div class="fmc-header">✈ TURBULENCE RISK FMC</div>

        <div class="fmc-scratchpad">

          <div class="form-row">
            <label>Airport:</label>
            <select name="airport" id="airport">
              <option value="">Select Airport</option>
              <option value="VABB">VABB - Mumbai</option>
              <option value="VIDP">VIDP - Delhi</option>
              <option value="VOHS">VOHS - Hyderabad</option>
            </select>
          </div>

          <div class="form-row">
            <label>Lat:</label>
            <input type="number" step="any" id="latitude" name="latitude" placeholder="deg" readonly>

            <label>Lon:</label>
            <input type="number" step="any" id="longitude" name="longitude" placeholder="deg" readonly>

            <label>Elev:</label>
            <input type="number" step="any" id="elevation" name="elevation" placeholder="ft" readonly>
          </div>

          <div class="form-row">
            <label>Date:</label>
            <input type="date" name="date">
            <label>Time:</label>
            <input type="time" name="time">
          </div>

          <div class="form-row">
            <label>Tmp:</label>
            <input type="number" name="tmp" placeholder="°C">
            <label>Dwpt:</label>
            <input type="number" name="dwpt" placeholder="°C">
            <label>RelH:</label>
            <input type="number" name="relh" placeholder="%">
          </div>

          <div class="form-row">
            <label>Wind Dir:</label>
            <input type="number" name="drct" placeholder="deg">
            <label>Sknt:</label>
            <input type="number" name="sknt" placeholder="kts">
            <label>Gust:</label>
            <input type="number" name="gust" placeholder="kts">
          </div>

          <div class="form-row">
            <label>Vsby:</label>
            <input type="number" name="vsby" placeholder="miles">
            <label>MSLP:</label>
            <input type="number" name="mslp" placeholder="hPa">
          </div>

          <div class="form-row nowrap">
            <label>Clouds C1-C4:</label>
            <input type="text" name="skyc1" placeholder="FEW">
            <input type="text" name="skyc2" placeholder="SCT">
            <input type="text" name="skyc3" placeholder="BKN">
            <input type="text" name="skyc4" placeholder="OVC">
          </div>

          <div class="form-row nowrap">
            <label>Clouds L1-L4:</label>
            <input type="number" name="skyl1" placeholder="ft">
            <input type="number" name="skyl2" placeholder="ft">
            <input type="number" name="skyl3" placeholder="ft">
            <input type="number" name="skyl4" placeholder="ft">
          </div>

          <div class="form-row">
            <label>WX Code:</label>
            <input type="text" name="wxcode" placeholder="RA / TS / BR">
          </div>

          <div class="form-row" style="justify-content:center;">
            <button type="submit" class="fmc-submit">PREDICT</button>
          </div>

        </div>

        <div class="fmc-output" id="output">
          {% if prediction_text %}
            {{ prediction_text | safe }}
          {% else %}
            Enter inputs and press PREDICT
          {% endif %}
       </div>

      </div>

    </form>

    <!-- Right buttons -->
    <div class="softkeys-right">
      <button type="button" class="softkey" id="submitBtn">SUBMIT</button>
      <button type="button" class="softkey" id="clrBtn">CLR</button>
      <button type="button" class="softkey" id="upBtnR">▲</button>
      <button type="button" class="softkey" id="downBtnR">▼</button>
    </div>

  </div>

</div>

<script>
const airportData = {
  VOHS:{lat:17.2333333, lon:78.4166666, elev:617},
  VIDP:{lat:28.584511, lon:77.205783, elev:214.88},
  VABB:{lat:19.088686, lon:72.867919, elev:11.27}
};

// Fill airport data on selection
function fillAirportData(){
  const airport = document.getElementById("airport").value;
  if(airportData[airport]){
    document.getElementById("latitude").value = airportData[airport].lat;
    document.getElementById("longitude").value = airportData[airport].lon;
    document.getElementById("elevation").value = airportData[airport].elev;
  } else {
    document.getElementById("latitude").value = "";
    document.getElementById("longitude").value = "";
    document.getElementById("elevation").value = "";
  }
}
document.getElementById("airport").addEventListener("change", fillAirportData);

// Navigation buttons
const inputs = Array.from(document.querySelectorAll(".fmc-scratchpad input,.fmc-scratchpad select"));
let currentIndex = 0;
function focusInput(index){ currentIndex = index; inputs[currentIndex].focus(); }
document.querySelectorAll("#upBtn,#upBtnR").forEach(btn=>{ btn.onclick=()=>{ currentIndex=(currentIndex-1+inputs.length)%inputs.length; focusInput(currentIndex); }});
document.querySelectorAll("#downBtn,#downBtnR").forEach(btn=>{ btn.onclick=()=>{ currentIndex=(currentIndex+1)%inputs.length; focusInput(currentIndex); }});

// RESET button
document.getElementById("resetBtn").onclick = () => {
  document.getElementById("fmcForm").reset();
  document.getElementById("latitude").value="";
  document.getElementById("longitude").value="";
  document.getElementById("elevation").value="";
  document.getElementById("output").innerText="Form Reset";
};

// CLR button
document.getElementById("clrBtn").onclick = () => {
  document.getElementById("fmcForm").reset();
  document.getElementById("latitude").value="";
  document.getElementById("longitude").value="";
  document.getElementById("elevation").value="";
  document.getElementById("output").innerText="";
};

// SUBMIT button
document.getElementById("submitBtn").onclick = () => { document.getElementById("fmcForm").submit(); };

// HELP button
document.getElementById("helpBtn").onclick = () => {
  document.getElementById("output").innerHTML = `
  <div class="help-container">
    <div class="help-title">FMC INPUT GUIDE</div>
    <div class="help-grid">
      <div class="help-col">
        TMP : Temperature (°C)<br>
        DWPT : Dewpoint (°C)<br>
        RELH : Relative Humidity %<br>
        DRCT : Wind Direction<br>
        SKNT : Wind Speed<br>
        GUST : Wind Gust
      </div>
      <div class="help-col">
        VSBY : Visibility<br>
        MSLP : Pressure<br>
        C1-C4 : FEW SCT BKN OVC<br>
        L1-L4 : Cloud Height<br>
        WXCODE : RA TS BR
      </div>
    </div>
  </div>
  `;
};
</script>

</body>
</html>
